<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Настройка оформления виджетов</title>
  <link rel="stylesheet" href="styles.css?v=024a489e">
  <script src="color-dialog.js" defer></script>
  <script src="app.js?v=64484d03" defer></script>
</head>
<body>
  <main class="demo">
    <section class="canvas" aria-label="Холст">
      <div class="preview-widget">
        <div class="toolbar" aria-hidden="true">
          <span><img src="assets/toolbar-back.svg" width="8" height="13" alt=""></span>
          <span><img src="assets/toolbar-settings.svg" width="19" height="20" alt=""></span>
          <span><img src="assets/toolbar-delete.svg" width="17" height="19" alt=""></span>
          <span><img src="assets/toolbar-more.svg" width="18" height="5" alt=""></span>
        </div>
        <div class="widget-layout">
          <div class="widget-frame">
            <div class="widget-preview" id="widget-preview" aria-label="Предпросмотр текстового поля">
              <div class="widget-content">
                <span id="preview-label" hidden></span>
                <span class="preview-input-wrap"><input id="preview-text" type="text" aria-label="Предпросмотр текстового поля" placeholder="Введите значение" autocomplete="off"></span>
              </div>
            </div>
          </div>
          <div class="insert-positions" aria-hidden="true"><img src="assets/insert-positions.png" alt=""></div>
        </div>
      </div>
    </section>
    <section class="settings-stage" aria-label="Настройки виджета">
      <h1>Виджет</h1>
      <div class="settings">
        <header class="window-header">
          <h2 id="window-title">Текст</h2>
          <h2 class="detail-heading" hidden><button class="detail-back" type="button" data-view="main"><span class="detail-back-icon" aria-hidden="true"></span><span class="detail-title"></span></button></h2>
          <span class="header-size size-steps" hidden></span>
          <div class="window-actions">
            <button class="header-reset" type="button" data-reset-widget aria-label="Сбросить настройки виджета" disabled>&#xe629;</button>
            <span aria-hidden="true"><img src="assets/save.svg" width="14" height="11" alt=""></span>
            <img class="close-icon" src="assets/close.svg" alt="" aria-hidden="true">
          </div>
        </header>
        <div class="window-content" id="settings-content"></div>
      </div>
    </section>
    <aside class="system-area" aria-label="Системная область">
      <div class="system-controls">
        <div class="system-toolbar">
          <span class="system-device"><img src="assets/system-web.svg" width="16" height="16" alt="">Web</span>
        </div>
        <div class="system-panel">
          <div class="system-card" role="radiogroup" aria-label="Состояние заполненности">
            <label class="system-option"><input type="radio" name="system-view" value="initial" checked>Первый вход</label>
            <label class="system-option"><input type="radio" name="system-view" value="maximum">Максимальное представление</label>
          </div>
          <div class="system-heading" id="system-type">Тип</div>
          <div class="system-card" role="radiogroup" aria-labelledby="system-type" aria-disabled="true">
            <span class="system-option" role="radio" aria-checked="true">Текст</span>
          </div>
        </div>
        <div class="system-panel system-appearance">
          <div class="system-card" role="radiogroup" aria-label="Компоновка оформления">
            <label class="system-option"><input type="radio" name="appearance-mode" value="grouped" checked>Оформление одним блоком</label>
            <label class="system-option"><input type="radio" name="appearance-mode" value="separate">Оформление разными свойствами</label>
          </div>
        </div>
      </div>
      <div class="system-panel system-note">
        <div class="system-status"><span aria-hidden="true">&#xe657;</span>Итерации с директором</div>
        <p class="system-card system-description">Механика настройки виджетов полей ввода в конструкторе и доп.полей</p>
        <div class="system-card system-person"><img src="assets/system-designer.svg" width="16" height="16" alt="">Хорошева Елизавета</div>
        <div class="system-card system-person"><img src="assets/system-developer.svg" width="16" height="16" alt="">Бегунов Андрей</div>
      </div>
    </aside>
  </main>
</body>
</html>
